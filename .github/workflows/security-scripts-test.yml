name: Security pipeline tests
on:
  pull_request:
    paths:
      - '.github/security-scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n .github/security-scripts/push-scan.sh .github/security-scripts/evaluate-and-notify.sh
      - run: python -m unittest discover -s .github/security-scripts/tests -v
